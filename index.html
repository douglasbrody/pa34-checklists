<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checklists">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Checklists</title>
<style>
  :root {
    --bg: #eceef1; --fg: #111; --card: #fff; --muted: #5f6670; --line: #d4d8de;
    --accent: #1e5bd8; --accent-fg: #fff; --done: #9aa0a8; --next: #1e5bd8;
    --warn-bg: #fff4d6; --warn-fg: #6b4a00; --tile-filter: none;
  }
  [data-theme="night"] {
    --bg: #000; --fg: #d6d6d6; --card: #141414; --muted: #8a8a8a; --line: #2a2a2a;
    --accent: #2c5fbf; --accent-fg: #e8e8e8; --done: #555; --next: #4d8dff;
    --warn-bg: #2a2100; --warn-fg: #e0b84a; --tile-filter: brightness(.62);
  }
  [data-theme="red"] {
    --bg: #000; --fg: #ff3b2f; --card: #120000; --muted: #a8221a; --line: #3a0805;
    --accent: #4a0000; --accent-fg: #ff4a3d; --done: #5c1410; --next: #ff3b2f;
    --warn-bg: #2a0000; --warn-fg: #ff6b5f; --tile-filter: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 20px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; -webkit-text-size-adjust: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  input, textarea { font: inherit; -webkit-user-select: text; user-select: text; }
  .wrap { padding: 16px; max-width: 1100px; margin: 0 auto; }

  /* ---------- Home ---------- */
  .home { height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 14px 16px 16px; }
  .home-head { display: flex; align-items: center; margin: 0 0 14px; flex: none; }
  .home-head > * + * { margin-left: 14px; }
  .home-head .next-tile { min-height: 76px; min-width: 130px; }
  .home-head h1 { flex: 1; margin-top: 0; margin-bottom: 0; font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
  .small-btn {
    min-height: 56px; padding: 0 20px; border-radius: 14px; font-size: 19px; font-weight: 700;
    background: var(--card); border: 1px solid var(--line); color: var(--fg);
  }
  .tiles { flex: 1; min-height: 0; display: grid; gap: 14px; overflow-y: auto; }
  .tile {
    min-height: 0; border-radius: 22px; padding: 10px 14px; text-align: center;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; line-height: 1.12; overflow-wrap: anywhere;
    filter: var(--tile-filter); box-shadow: 0 2px 6px rgba(0,0,0,.15);
    transition: transform .08s;
  }
  .tile:active, .home-tile:active, .next-tile:active { transform: scale(.97); }
  [data-theme="red"] .tile { background: #1a0000 !important; color: var(--fg); border: 2px solid #5a0d08; box-shadow: none; }
  .empty { padding: 40px 10px; text-align: center; color: var(--muted); }

  /* ---------- Checklist ---------- */
  .page { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .bar { flex: none; display: flex; padding: 12px 16px; border-bottom: 2px solid var(--line); }
  .bar > * + * { margin-left: 12px; }
  .home-tile, .next-tile {
    min-height: 92px; border-radius: 20px; padding: 0 22px; font-size: 30px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .home-tile { min-width: 190px; background: var(--accent); color: var(--accent-fg); }
  .home-tile svg { width: 36px; height: 36px; flex: none; margin-right: 10px; }
  .next-tile {
    min-width: 150px; max-width: 34%; background: var(--card); border: 2px solid var(--line);
    font-size: 22px; flex-direction: column; line-height: 1.15;
  }
  .next-tile small { font-size: 15px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .next-tile span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; line-height: 1.1; -webkit-box-orient: vertical; text-align: center; }
  .bar .spacer { flex: .0001 1 0; }   /* tiles grow first (up to their max); the spacer takes any leftover */
  .bar .next-tile { flex: 1 1 0; min-width: 0; max-width: 230px; padding: 0 12px; font-size: 20px; }
  .bar .next-tile small { font-size: 14px; }
  .bar .home-tile { min-width: 160px; padding: 0 18px; font-size: 27px; }
  .list-title {
    flex: none; margin: 0; padding: 10px 16px 0; text-align: center;
    font-size: 30px; font-weight: 850; line-height: 1.15;
  }
  .emer .list-title { color: #c62828; }
  [data-theme="night"] .emer .list-title { color: #e0554d; }
  [data-theme="red"] .emer .list-title { color: var(--fg); }
  .group-title { font-size: 34px !important; }
  .home-head .home-tile { min-height: 76px; min-width: 170px; font-size: 26px; }
  .fit { flex: 1; min-height: 0; overflow: hidden; padding: 10px 16px 14px; }
  .fit.scroll { overflow-y: auto; }
  .sheet { column-gap: 1.4em; column-rule: 2px solid var(--line); }
  .row {
    display: flex; align-items: baseline; padding: var(--rp, .22em) .4em; border-radius: .25em;
    break-inside: avoid; font-weight: 600;
  }
  .row:nth-child(even of .row) { background: var(--card); }
  .row .c { flex: none; white-space: nowrap; }
  .row .lead { margin: 0 .35em; flex: 1 1 .8em; min-width: .8em; border-bottom: .12em dotted var(--muted); opacity: .6; transform: translateY(-.25em); }
  .row .r { flex: none; white-space: nowrap; font-weight: 850; text-align: right; }
  /* When lines are too long for one row, both sides shrink in proportion and wrap evenly. */
  .sheet.wrapr .row .c, .sheet.wrapr .row .r { flex: 0 1 auto; white-space: normal; }
  .sheet.wrapr .row { align-items: center; }
  .sheet.wrapr .row .lead { transform: none; }
  .row.text .c { flex: 1 1 auto; white-space: normal; font-weight: 500; }
  .row.hl, .row.hl:nth-child(even of .row) { background: #fff19a; color: #111; }
  [data-theme="night"] .row.hl, [data-theme="night"] .row.hl:nth-child(even of .row) { background: #3d3500; color: #f2e27a; }
  [data-theme="red"] .row.hl, [data-theme="red"] .row.hl:nth-child(even of .row) { background: #3a0000; color: var(--fg); }
  .sec {
    font-size: .72em; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    padding: calc(.5em + var(--rp, .22em)) .55em .25em; break-after: avoid; break-inside: avoid;
  }
  .sec:first-child { padding-top: 0; }
  .choices { flex: none; display: flex; padding: 0 16px 16px; }
  .choices > * + * { margin-left: 14px; }
  .choice {
    flex: 1; min-height: 110px; border-radius: 20px; padding: 10px 16px; color: #fff;
    font-size: 36px; font-weight: 850; letter-spacing: 1px; line-height: 1.1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    filter: var(--tile-filter); box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .choice:active { transform: scale(.97); }
  .choice small { font-size: 16px; font-weight: 600; letter-spacing: 0; opacity: .9; margin-top: 6px; }
  .choice.c0 { background: #1e5bd8; } .choice.c1 { background: #b45309; } .choice.c2 { background: #138a4a; }
  .choice.missing { background: var(--card); color: var(--muted); border: 2px dashed var(--line); }
  [data-theme="red"] .choice { background: #1a0000 !important; color: var(--fg); border: 2px solid #5a0d08; box-shadow: none; }
  .note {
    margin: .2em 0 .35em; padding: .35em .5em; border-radius: .3em; background: var(--warn-bg); color: var(--warn-fg);
    font-size: .8em; font-weight: 700; break-inside: avoid;
  }

  /* ---------- Flight data (ATIS, takeoff data) ---------- */
  .fv { border-bottom: .09em solid currentColor; padding: 0 .08em; }
  .fv.empty { opacity: .5; }
  .row.tap:active { opacity: .6; }
  .wx {
    flex: none; display: block; width: auto; margin: 0 16px 12px; padding: 10px 14px; border-radius: 14px;
    background: var(--card); border: 2px solid var(--line); font-size: 19px; font-weight: 700; text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .wx { display: flex; align-items: baseline; }
  .wx b { color: var(--next); }
  .wx-key { flex: none; white-space: nowrap; }
  .wx-xw { font-weight: 850; }
  .wx-rest { flex: 1 1 auto; min-width: 0; margin-left: .3em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .wx.empty { border-style: dashed; border-color: var(--next); color: var(--next); }
  .home .wx { margin: 14px 0 0; }
  .foot { flex: none; display: flex; align-items: stretch; margin: 0 16px 12px; }
  .home .foot { margin: 14px 0 0; }
  .foot .wx { flex: 1 1 auto; min-width: 0; margin: 0 12px 0 0; }
  .emerg-tile {
    flex: none; margin-left: auto; min-height: 60px; padding: 0 20px; border-radius: 14px;
    background: #c62828; color: #fff; font-size: 22px; font-weight: 850; letter-spacing: .5px;
    filter: var(--tile-filter); box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .emerg-tile:active { transform: scale(.97); }
  [data-theme="red"] .emerg-tile { background: #3a0000; color: var(--fg); border: 2px solid #8a1a14; box-shadow: none; }
  .data-foot { position: -webkit-sticky; position: sticky; bottom: 0; padding: 10px 0 12px; background: var(--bg); }
  .data-foot .foot { margin: 0; }
  .tabs { display: flex; margin: 0 0 14px; }
  .tabs > * + * { margin-left: 10px; }
  .tab { flex: 1; min-height: 66px; border-radius: 14px; font-size: 19px; font-weight: 800; background: var(--card); border: 2px solid var(--line); line-height: 1.15; }
  .tab.on { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .calc { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; font-size: 28px; font-weight: 850; margin: 0 0 12px; text-align: center; line-height: 1.25; }
  .calc small { display: block; font-size: 15px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px; }
  .field { min-height: 84px; border-radius: 14px; background: var(--card); border: 2px solid var(--line); text-align: left; padding: 8px 14px; }
  .field small { display: block; font-size: 14px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .field span { font-size: 30px; font-weight: 850; }
  .field span.empty { color: var(--muted); font-weight: 600; font-size: 22px; }
  .big-go { width: 100%; min-height: 76px; border-radius: 16px; background: var(--accent); color: var(--accent-fg); font-size: 26px; font-weight: 850; margin: 0 0 12px; }
  #pad { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; background: rgba(0,0,0,.5); display: flex; flex-direction: column; justify-content: flex-end; }
  #pad .sheet2 { max-height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); border-radius: 22px 22px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }
  .pad-top { display: flex; align-items: baseline; font-size: 22px; font-weight: 800; }
  .pad-top span { flex: 1; }
  .pad-top small { font-size: 16px; color: var(--muted); font-weight: 700; }
  .pad-val { font-size: 56px; font-weight: 850; text-align: center; min-height: 76px; line-height: 76px; }
  .pad-val .was { color: var(--muted); font-weight: 600; font-size: 40px; }
  .pad-val .unit { font-size: 26px; color: var(--muted); margin-left: 8px; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: 10px; }
  .keys.letters { grid-template-columns: repeat(7, 1fr); }
  .key { min-height: 74px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); font-size: 34px; font-weight: 800; }
  .keys.letters .key { min-height: 62px; font-size: 28px; }
  .key:active, .pad-act button:active { transform: scale(.96); }
  .pad-act { display: flex; margin-top: 12px; }
  .pad-act > * + * { margin-left: 10px; }
  .pad-act button { flex: 1; min-height: 74px; border-radius: 16px; font-size: 26px; font-weight: 850; background: var(--card); border: 2px solid var(--line); }
  .pad-act .go { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .taxi-read { font-size: 30px; font-weight: 850; text-align: center; min-height: 76px; padding: 8px 4px; line-height: 1.25; }
  .taxi-read .was, .taxi-show .was { color: var(--muted); font-weight: 600; font-size: 22px; }
  .taxi-modes { display: flex; margin-bottom: 10px; }
  .taxi-modes > * + * { margin-left: 8px; }
  .taxi-modes .key { flex: 1; min-height: 62px; font-size: 19px; }
  .taxi-modes .key.on { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .kp-label { font-size: 14px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 8px 2px 6px; }
  .keys.rwy36 { grid-template-columns: repeat(9, 1fr); }
  .keys.rwy36 .key { min-height: 58px; font-size: 26px; }
  .keys.pairs { grid-template-columns: repeat(6, 1fr); }
  .keys.pairs .key { min-height: 54px; font-size: 21px; }
  .keys.sfx { grid-template-columns: repeat(4, 1fr); margin-top: 10px; }
  .keys.sfx .key { min-height: 56px; font-size: 26px; }
  .keys.sfx .key.wide { grid-column: span 4; }
  .keys.sfx .key.wide2 { grid-column: span 1; font-size: 19px; }
  #pad .keys.letters .key { min-height: 52px; font-size: 24px; }
  .taxi-show { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 22px 18px; font-size: 38px; font-weight: 850; line-height: 1.3; text-align: center; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  /* Phone-width screens: let the top tiles share the width instead of running off screen. */
  @media (max-width: 600px) {
    .emerg-tile { padding: 0 12px; font-size: 17px; letter-spacing: 0; }
    .foot .wx { margin-right: 8px; font-size: 16px; padding: 8px 10px; display: block; white-space: normal; line-height: 1.25; }
    .foot .wx-key { white-space: normal; }
    .foot .wx-rest { display: none; }   /* phones: runway + components only, wrapping if needed */
    .bar { padding: 10px 12px; }
    .bar > * + * { margin-left: 8px; }
    .home-tile { min-width: 0; padding: 0 16px; font-size: 24px; }
    .home-tile svg { width: 28px; height: 28px; margin-right: 8px; }
    .next-tile, .bar .next-tile { min-width: 0; flex: 1 1 0; max-width: none; font-size: 16px; padding: 0 6px; }
    .bar .next-tile small { font-size: 12px; letter-spacing: 0; }
    .bar .home-tile { min-width: 72px; padding: 0 10px; }
    .bar .home-tile span { display: none; }            /* house icon only on phones */
    .bar .home-tile svg { width: 38px; height: 38px; margin-right: 0; }
    .bar .spacer { display: none; }
    .home-head .home-tile { min-width: 0; }
    .home-head .next-tile { min-width: 0; flex: none; }
  }

  /* ---------- Edit ---------- */
  .edit-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 8px 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  }
  .edit-row .swatch { width: 20px; height: 44px; border-radius: 6px; flex: none; }
  .edit-row .name { flex: 1; font-weight: 700; }
  .edit-row .name small { display: block; font-weight: 500; color: var(--muted); font-size: 15px; }
  .icon-btn { width: 52px; height: 52px; border-radius: 12px; border: 1px solid var(--line); font-size: 22px; }
  .icon-btn:disabled { opacity: .25; }
  label.f { display: block; font-weight: 700; margin: 18px 0 8px; }
  input[type=text], textarea {
    width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg);
  }
  textarea { min-height: 46vh; font: 18px/1.45 ui-monospace, Menlo, monospace; }
  .colors { display: flex; flex-wrap: wrap; gap: 10px; }
  .colors button { width: 56px; height: 56px; border-radius: 14px; border: 3px solid transparent; }
  .colors button.sel { border-color: var(--fg); }
  .help { color: var(--muted); font-size: 16px; line-height: 1.5; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
  .help code { font-family: ui-monospace, Menlo, monospace; color: var(--fg); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
  .actions .grow { flex: 1; }
  .danger { color: #d93025 !important; }
  [data-theme="red"] .danger { color: var(--fg) !important; }
</style>
</head>
<body>
<div id="app"><div class="wrap" style="padding-top:40px;font-size:22px">Loading checklists…</div></div>
<script>
  window.onerror = function (msg, src, line) {
    var app = document.getElementById('app');
    app.innerHTML = '<div class="wrap" style="padding-top:40px;font-size:20px;line-height:1.5">' +
      '<b>The checklist app hit an error.</b><br>Please send this to whoever set it up:<br><br>' +
      '<code style="-webkit-user-select:text;user-select:text">' + String(msg).replace(/</g, '&lt;') +
      ' (' + String(src || '').split('/').pop() + ':' + line + ')<br>' + navigator.userAgent.replace(/</g, '&lt;') + '</code></div>';
  };
</script>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="defaults.js"></script>
<script>
'use strict';

const COLORS = ['#1e5bd8', '#138a4a', '#d9730d', '#6b3fc7', '#0f7f8a', '#c62828', '#4a4f57', '#a37800'];

/* ---------- Storage ---------- */
const KEY = 'checklists.v2', THEME_KEY = 'theme.v1';
const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function read(k, fallback) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? fallback : v; } catch (e) { return fallback; } }
function write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const freshDefaults = () => DEFAULTS.map(s => ({ id: uid(), ...s }));

// Checklist content updates: an iPad whose checklists were never edited picks up new defaults
// automatically. Edited checklists are never overwritten; the Edit screen offers a restore instead.
const VER_KEY = 'defaults.version', EDITED_KEY = 'edited';
const fnv = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16); };
const sig = ls => fnv(ls.map(l => [l.title, l.group || '', l.color, l.text].join('\u0001')).join('\u0002'));
const V1_SIG = '16c8b9d0';   // the first published checklist set, before versioning existed

let lists = read(KEY, null);
let edited = read(EDITED_KEY, null);
if (Array.isArray(lists) && edited === null) edited = sig(lists) !== V1_SIG;
if (!Array.isArray(lists) || (!edited && read(VER_KEY, 1) !== DEFAULTS_VERSION)) {
  lists = freshDefaults(); edited = false;
  write(KEY, lists); write(VER_KEY, DEFAULTS_VERSION);
}
write(EDITED_KEY, edited);
const markEdited = () => { edited = true; write(EDITED_KEY, true); };
let theme = read(THEME_KEY, 'day');

function saveLists() { if (!write(KEY, lists)) alert('Could not save. Storage may be full or disabled.'); markEdited(); }

/* ---------- Helpers ---------- */
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brk = s => esc(s).replace(/\//g, '/<wbr>');   // allow wrapping after slashes, e.g. Mixture/Prop/Throttle
const find = id => lists.find(l => l.id === id);
const ICON_HOME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>';

// Text format: "# Section", "! Caution", "Challenge ... Response", "* highlighted line", plain text,
// or "-> Label | optional subtitle : Checklist title" for a big button at the bottom that opens that checklist.
function parse(text) {
  const out = []; let n = 0;
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('->')) {
      const m = line.slice(2).split(':'), lab = m[0].split('|');
      out.push({ type: 'choice', label: lab[0].trim(), sub: (lab[1] || '').trim(), target: m.slice(1).join(':').trim() });
    }
    else if (line.startsWith('#')) out.push({ type: 'section', text: line.replace(/^#+\s*/, '') });
    else if (line.startsWith('!')) out.push({ type: 'note', text: line.replace(/^!+\s*/, '') });
    else {
      const hl = line.startsWith('*'), body = hl ? line.replace(/^\*+\s*/, '') : line;
      const m = body.split(/\s*(?:\.{3,}|…+)\s*/);

/* ---------- Groups ---------- */
// A checklist's "group" is a path like "Emergency/Electrical". Each level is a tile screen:
// the home screen shows top-level groups, a group screen shows its sub-groups and its own checklists.
const cleanGroup = g => (g || '').split('/').map(x => x.trim()).filter(Boolean).join('/');
function groups(path) {
  const out = [], by = {}, prefix = path ? path + '/' : '';
  for (const l of lists) {
    const g = cleanGroup(l.group);
    if (g === path) { out.push({ list: l }); continue; }
    if (path && !g.startsWith(prefix)) continue;
    const name = g.slice(prefix.length).split('/')[0], full = prefix + name;
    if (!by[full]) { by[full] = { name, path: full, color: l.color }; out.push(by[full]); }
  }
  return out;
}
const groupHash = g => '#/g/' + encodeURIComponent(g);
const lastPart = g => g.split('/').pop();
const parentOf = g => g.split('/').slice(0, -1).join('/');
const isEmergency = g => /emerg/i.test(g || '');

// Next follows the order of normal procedures. Emergency checklists stand alone; real
// emergency sequences use explicit "->" buttons instead (e.g. Memory Items -> FIX / FEATHER).
function nextOf(l, step) {
  const n = lists[lists.indexOf(l) + (step || 1)];
  if (!n || isEmergency(l.group) || isEmergency(n.group)) return null;
  return n;
}
const prevOf = l => nextOf(l, -1);

/* ---------- Screens ---------- */
const tileHtml = (label, color, hash) =>
  `<button class="tile" style="background:${esc(color)}" data-go="${hash}">${esc(label)}</button>`;
const groupTile = g => g.list ? tileHtml(g.list.title, g.list.color, `#/list/${g.list.id}`) : tileHtml(g.name, g.color, groupHash(g.path));

function renderHome() {
  const tiles = groups('').map(groupTile).join('') + tileHtml('ATIS & Takeoff Data', '#0f7f8a', '#/data/' + (fd._active || 'dep'));
  $app.innerHTML = `<div class="home">
    <div class="home-head">
      <h1>Checklists</h1>
      <button class="small-btn" data-act="theme">${THEME_LABEL[theme]}</button>
      <button class="small-btn" data-go="#/edit">Edit</button>
    </div>
    ${lists.length ? `<div class="tiles">${tiles}</div>` : `<div class="empty">No checklists yet. Tap <b>Edit</b> to add one.</div>`}
    ${wxLine()}
  </div>`;
  layout();
}

function renderGroup(path) {
  path = cleanGroup(path);
  const items = groups(path);
  if (!path || !items.length) return go('#/');
  const parent = parentOf(path);
  $app.innerHTML = `<div class="home">
    <div class="home-head">
      <button class="home-tile" data-go="#/">${ICON_HOME}<span>HOME</span></button>
      ${parent ? `<button class="next-tile" data-go="${groupHash(parent)}"><small>↑ Back to</small><span>${esc(lastPart(parent))}</span></button>` : ''}
      <h1 class="group-title">${esc(lastPart(path))}</h1>
    </div>
    <div class="tiles">${items.map(groupTile).join('')}</div>
    ${footer(wxLine(), isEmergency(path))}
  </div>`;
  layout();
}

// Size tiles to fill the screen, then pick the biggest font at which every label fits its tile.
function layoutTiles() {
  const grid = $app.querySelector('.tiles'); if (!grid) return;
  const tiles = [...grid.children], n = tiles.length, W = grid.clientWidth, H = grid.clientHeight, gap = 14;
  let cols = W >= 900 ? 3 : 2;
  if (n > 12) cols = W >= 900 ? 4 : 3;
  if (n <= 3 && W < 900) cols = 1;
  const rows = Math.ceil(n / cols);
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  // Stretch the last tile across any empty cells so the bottom row is filled.
  tiles.forEach(t => t.style.gridColumn = '');
  if (n % cols) tiles[n - 1].style.gridColumn = `span ${cols - (n - 1) % cols}`;
  grid.style.gridAutoRows = Math.max(96, Math.floor((H - gap * (rows - 1)) / rows)) + 'px';
  for (let px = 46; px >= 16; px -= 1) {
    grid.style.fontSize = px + 'px';
    if (!tiles.some(t => t.scrollHeight > t.clientHeight + 1 || t.scrollWidth > t.clientWidth + 1)) break;
  }
}

function renderList(id) {

    if (b.type === 'text') {

      return `<div class="row text${b.hl ? ' hl' : ''}${tk.length ? ' tap' : ''}"${tk.length ? ` data-keys="${tk.join(' ')}"` : ''}><span class="c">${fillTokens(esc(b.text))}</span></div>`;

    return t ? `<button class="choice c${i % 3}" data-go="#/list/${t.id}">${esc(c.label)}<small>${esc(c.sub || t.title)}</small></button>`
             : `<button class="choice missing" disabled>${esc(c.label)}<small>Not found: ${esc(c.target)}</small></button>`;
  }).join('');
  $app.innerHTML = `<div class="page${isEmergency(g) ? ' emer' : ''}">

      <button class="home-tile" data-go="#/">${ICON_HOME}<span>HOME</span></button>
      ${g ? `<button class="next-tile" data-go="${groupHash(g)}"><small>↑ Back to</small><span>${esc(lastPart(g))}</span></button>` : ''}
      <span class="spacer"></span>
      ${prev ? `<button class="next-tile" data-go="#/list/${prev.id}"><small>← Previous</small><span>${esc(prev.title)}</span></button>` : ''}
      ${next ? `<button class="next-tile" data-go="#/list/${next.id}"><small>Next →</small><span>${esc(next.title)}</span></button>` : ''}
    </div>
    <h2 class="list-title">${esc(l.title)}</h2>
    <div class="fit"><div class="sheet">${body || '<div class="empty">This checklist is empty.</div>'}</div></div>
    ${choiceHtml ? `<div class="choices">${choiceHtml}</div>` : ''}
    ${footer(wxLine(phaseSide(l)), isEmergency(l.group))}
  </div>`;
  layout();
}

// Size the checklist so it fits on one screen without scrolling:
//  1. Largest font up to a comfortable maximum with every item on one line (one or two columns).
//  2. Only if that would be too small, let long items wrap (when it is clearly bigger).
//  3. Any spare height becomes spacing between lines rather than bigger text.
function layoutList() {
  const fit = $app.querySelector('.fit'), sheet = $app.querySelector('.sheet'); if (!fit) return;
  fit.classList.remove('scroll');
  const cs = getComputedStyle(fit);
  const H = fit.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const W = fit.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const MIN = 16, MAX = 34, WRAP_BELOW = 24, PAD = 0.22, PAD_MAX = 0.9;
  const set = (cols, px, wrap, pad) => {
    sheet.style.columnCount = cols; sheet.style.fontSize = px + 'px';
    sheet.style.setProperty('--rp', pad + 'em'); sheet.classList.toggle('wrapr', wrap);
  };
  // When wrapping is allowed, only a few items (at most 1 in 5) may actually wrap.
  const items = [...sheet.querySelectorAll('.row:not(.text)')];
  const allowWrapped = Math.max(1, Math.floor(items.length / 5));
  const fits = (cols, px, wrap, pad = PAD) => {
    set(cols, px, wrap, pad);
    if (sheet.scrollHeight > H + 1 || sheet.scrollWidth > W + 1) return false;
    if (wrap && items.filter(r => [...r.children].some(x => x.offsetHeight > px * 1.95)).length > allowWrapped) return false;
    return ![...sheet.querySelectorAll('.row')].some(r => {
      const end = r.getBoundingClientRect().right - parseFloat(getComputedStyle(r).paddingRight);
      return r.lastElementChild.getBoundingClientRect().right > end + 0.5;
    });
  };
  const best = (cols, wrap) => {
    if (!fits(cols, MIN, wrap)) return 0;
    if (fits(cols, MAX, wrap)) return MAX;
    let lo = MIN, hi = MAX;
    while (hi - lo > 0.5) { const mid = (lo + hi) / 2; fits(cols, mid, wrap) ? lo = mid : hi = mid; }
    return lo;
  };
  const pick = wrap => {
    const one = best(1, wrap), two = W >= 600 ? best(2, wrap) : 0;
    return two > one * 1.2 ? { cols: 2, px: two, wrap } : { cols: 1, px: one, wrap };
  };
  let c = pick(false);
  if (c.px < WRAP_BELOW) { const w = pick(true); if (w.px > c.px * 1.15) c = w; }
  if (!c.px) {   // nothing fits even small: wrap freely, and scroll only as a last resort
    items.length = 0; c = { cols: 1, px: best(1, true), wrap: true };
    if (!c.px) { set(1, MIN, true, PAD); fit.classList.add('scroll'); return; }
  }
  const px = Math.floor(c.px);
  let lo = PAD, hi = PAD_MAX;
  if (fits(c.cols, px, c.wrap, hi)) lo = hi;
  else while (hi - lo > 0.02) { const mid = (lo + hi) / 2; fits(c.cols, px, c.wrap, mid) ? lo = mid : hi = mid; }
  set(c.cols, px, c.wrap, lo);
}

// Shrink a top-bar tile's label until the whole name fits (three lines at most).
function layoutBar() {
  document.querySelectorAll('.next-tile span').forEach(sp => {
    for (let px = 20; px >= 13; px--) {
      sp.style.fontSize = px + 'px';
      if (sp.scrollHeight <= sp.clientHeight + 1 && sp.scrollWidth <= sp.clientWidth + 1) break;
    }
  });
}

function layout() { layoutBar(); layoutTiles(); layoutList(); }
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 60); });

function renderManage() {
  const rows = lists.map((l, i) => `
    <div class="edit-row">

      <button class="icon-btn" data-act="up" data-id="${l.id}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">▲</button>
      <button class="icon-btn" data-act="down" data-id="${l.id}" ${i === lists.length - 1 ? 'disabled' : ''} aria-label="Move down">▼</button>

  $app.innerHTML = `<div class="wrap">
    <div class="home-head">

    </div>
    ${read(VER_KEY, 1) !== DEFAULTS_VERSION ? `<div class="note">Updated PA-34 checklists are available. Your edited checklists were kept. To get the update, export a backup, then tap <b>Restore PA-34 defaults</b> at the bottom.</div>` : ''}
    <div class="actions"><button class="small-btn grow" data-act="new">+ New checklist</button></div>

    <div class="actions" style="margin-top:28px">

let draft = null;
function renderEditor(id) {
  if (!draft || draft.id !== id) {
    const l = id === 'new' ? { id: 'new', title: '', color: COLORS[lists.length % COLORS.length], text: '' } : find(id);
    if (!l) return go('#/edit');
    draft = { ...l };
  }
  $app.innerHTML = `<div class="wrap">
    <div class="home-head"><h1>${id === 'new' ? 'New Checklist' : 'Edit Checklist'}</h1></div>
    <label class="f" for="t">Title</label>
    <input type="text" id="t" value="${esc(draft.title)}" placeholder="e.g. Before Takeoff">
    <label class="f" for="g">Group <span style="font-weight:400;color:var(--muted)">(checklists in the same group share one tile; use / for a sub-group, e.g. Emergency/Electrical; blank = its own tile)</span></label>
    <input type="text" id="g" list="groups" value="${esc(draft.group || '')}" placeholder="e.g. Emergency">
    <datalist id="groups">${[...new Set(lists.map(l => l.group).filter(Boolean))].map(g => `<option value="${esc(g)}">`).join('')}</datalist>

    <div class="colors">${COLORS.map(c => `<button data-act="color" data-c="${c}" style="background:${c}" class="${c === draft.color ? 'sel' : ''}" aria-label="Color"></button>`).join('')}</div>
    <label class="f" for="x">Items (one per line)</label>
    <textarea id="x" spellcheck="false" autocapitalize="sentences" placeholder="Fuel selector ... BOTH">${esc(draft.text)}</textarea>
    <div class="help">
      <code>Fuel selector ... BOTH</code> item with a response (3+ dots between)<br>
      <code>Seat belts</code> line with no response (wraps if long)<br>
      <code>* HOBBS/TACH Times ... RECORDED</code> highlighted line<br>
      <code># Engine</code> section heading<br>
      <code>! Caution text</code> highlighted caution note<br>
      <code>Wind ... {dep.comp}</code> shows flight data (e.g. {dep.sum}, {arr.sum}, {dep.hw}, {tob.len}, {taxi}); tap the line to enter it<br>
      <code>-> FEATHER | Feathering procedure : Feathering Procedure</code> big button at the bottom (label | subtitle : title of the checklist to open)
    </div>
    <div class="actions">
      <button class="small-btn grow" data-act="cancel">Cancel</button>
      <button class="home-tile grow" style="min-height:60px;font-size:22px" data-act="save">Save</button>
    </div>
    ${id !== 'new' ? `<div class="actions"><button class="small-btn danger" data-act="delete">Delete this checklist</button></div>` : ''}
  </div>`;
}

/* ---------- Routing ---------- */
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (p[0] !== 'edit') draft = null;
  if (p[0] === 'list') renderList(p[1]);
  else if (p[0] === 'data') renderData(p[1] || fd._active || 'dep');
  else if (p[0] === 'g') renderGroup(decodeURIComponent(p.slice(1).join('/')));
  else if (p[0] === 'edit') p[1] ? renderEditor(p[1]) : renderManage();
  else renderHome();
  setWake(p[0] === 'list');
  window.scrollTo(0, 0);
  document.body.style.overflow = p[0] === 'edit' || p[0] === 'data' ? '' : 'hidden';
}
addEventListener('hashchange', route);

/* ---------- Events ---------- */
$app.addEventListener('click', e => {
  const row = e.target.closest('.row.tap');
  if (row) return row.dataset.keys === '@taxi' ? openTaxi() : openPad(row.dataset.keys.split(' ').filter(k => k !== '@taxi'));
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);

  const id = t.dataset.id, i = lists.findIndex(l => l.id === id);
  switch (t.dataset.act) {
    case 'theme':
      theme = { day: 'night', night: 'red', red: 'day' }[theme]; write(THEME_KEY, theme); applyTheme(); renderHome(); break;
    case 'up': case 'down': {
      const j = t.dataset.act === 'up' ? i - 1 : i + 1;
      [lists[i], lists[j]] = [lists[j], lists[i]]; saveLists(); renderManage(); break;
    }
    case 'new': go('#/edit/new'); break;
    case 'color':
      draft.color = t.dataset.c;
      $app.querySelectorAll('.colors button').forEach(b => b.classList.toggle('sel', b === t)); break;
    case 'cancel': draft = null; go('#/edit'); break;
    case 'save': {
      draft.title = document.getElementById('t').value.trim() || 'Untitled';
      draft.text = document.getElementById('x').value;
      draft.group = cleanGroup(document.getElementById('g').value);
      if (draft.id === 'new') lists.push({ ...draft, id: uid() });
      else lists[lists.findIndex(l => l.id === draft.id)] = { ...draft };
      saveLists(); draft = null; go('#/edit'); break;
    }
    case 'delete':
      if (confirm(`Delete "${draft.title}"? This cannot be undone.`)) {
        lists = lists.filter(l => l.id !== draft.id);
        saveLists(); draft = null; go('#/edit');
      }
      break;
    case 'samples':
      if (confirm('Replace ALL your checklists with the original PA-34-200 set? Export a backup first if you want to keep your edits.')) {
        lists = freshDefaults(); saveLists();
        edited = false; write(EDITED_KEY, false); write(VER_KEY, DEFAULTS_VERSION); renderManage();
      }
      break;
    case 'export': exportBackup(); break;
    case 'back': history.length > 1 ? history.back() : go('#/'); break;
    case 'padall': case 'padfrom': {
      const keys = (t.dataset.tab === 'tob' ? TOB_FIELDS : atisFields(t.dataset.tab)).map(f => f.k);
      openPad(keys, t.dataset.act === 'padfrom' ? +t.dataset.i : 0); break;
    }
    case 'clearfd': {
      const pre = t.dataset.tab + '.';
      Object.keys(fd).forEach(k => k.startsWith(pre) && delete fd[k]); saveFd(); route();
      break;
    }
    case 'taxi': openTaxi(); break;
    case 'cleartaxi': delete fd.taxi; saveFd(); route(); break;
    case 'newflight':
      fd = {}; saveFd(); go('#/data/dep');
      break;
    case 'import': document.getElementById('importFile').click(); break;
  }
});

// Keep the draft in sync so a re-render (e.g. rotation) never loses typing.
$app.addEventListener('input', e => {
  if (!draft) return;
  if (e.target.id === 't') draft.title = e.target.value;
  if (e.target.id === 'x') draft.text = e.target.value;
  if (e.target.id === 'g') draft.group = e.target.value;
});

async function exportBackup() {
  const data = JSON.stringify({ app: 'checklists', version: 1, lists: lists.map(({ title, group, color, text }) => ({ title, group, color, text })) }, null, 2);
  const name = `checklists-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([data], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const arr = Array.isArray(d) ? d : d.lists;
    if (!Array.isArray(arr) || !arr.every(x => x && typeof x.title === 'string' && typeof x.text === 'string')) throw new Error('bad');
    if (!confirm(`Import ${arr.length} checklists? This replaces your current ones.`)) return;
    lists = arr.map(x => ({ id: uid(), title: x.title, group: typeof x.group === 'string' ? x.group : '', color: COLORS.includes(x.color) ? x.color : COLORS[0], text: x.text }));
    saveLists(); renderManage();
  } catch (err) { alert('That file is not a valid checklist backup.'); }
});

/* ---------- Start ---------- */
applyTheme();
route();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // Check for a new version on launch and whenever the app comes back to the foreground
  // (a home-screen app can sit suspended for days), then reload once to show it.
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading || location.hash.startsWith('#/edit')) return;
    reloading = true; location.reload();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
