<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checklists">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Checklists</title>
<style>
  :root {
    --bg: #eceef1; --fg: #111; --card: #fff; --muted: #5f6670; --line: #d4d8de;
    --accent: #1e5bd8; --accent-fg: #fff; --next: #1e5bd8; --tok: #1752c9; --warnc: #c2410c;
    --warn-bg: #fff4d6; --warn-fg: #6b4a00; --tile-filter: none;
    --hl-bg: #fff19a; --hl-fg: #111; --pulse-bg: #ffc93a;
    --scan-bg: rgba(255, 255, 255, .58); --scan-fg: rgba(17, 34, 68, .78); --scan-line: rgba(30, 91, 216, .28); --scan-cover: rgba(240, 242, 246, .96);
    --vh: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  }
  [data-theme="night"] {
    --bg: #000; --fg: #d6d6d6; --card: #141414; --muted: #8a8a8a; --line: #2a2a2a;
    --accent: #2c5fbf; --accent-fg: #e8e8e8; --next: #4d8dff; --tok: #7fb0ff; --warnc: #ff9f43;
    --warn-bg: #2a2100; --warn-fg: #e0b84a; --tile-filter: brightness(.62);
    --hl-bg: #3d3500; --hl-fg: #f2e27a; --pulse-bg: #6e5c00;
    --scan-bg: rgba(70, 70, 70, .42); --scan-fg: rgba(230, 230, 230, .8); --scan-line: rgba(255, 255, 255, .18); --scan-cover: rgba(28, 28, 28, .96);
  }
  [data-theme="red"] {
    --bg: #000; --fg: #ff3b2f; --card: #120000; --muted: #d83a2e; --line: #3a0805;
    --accent: #4a0000; --accent-fg: #ff4a3d; --next: #ff3b2f; --tok: #ff6b5f; --warnc: #ff8a7f;
    --warn-bg: #2a0000; --warn-fg: #ff6b5f; --tile-filter: none;
    --hl-bg: #3a0000; --hl-fg: #ff6b5f; --pulse-bg: #6a0c06;
    --scan-bg: rgba(70, 0, 0, .45); --scan-fg: rgba(255, 74, 61, .85); --scan-line: rgba(255, 59, 47, .3); --scan-cover: rgba(30, 0, 0, .96);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 20px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; -webkit-text-size-adjust: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* Day theme: a dark band so the white status-bar clock stays readable in the Home Screen app. */
  [data-theme="day"] body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #1b1d21; z-index: 60; pointer-events: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  input, textarea { font: inherit; -webkit-user-select: text; user-select: text; }
  .wrap { padding: 16px; max-width: 1100px; margin: 0 auto; }
  .warn { color: var(--warnc) !important; font-weight: 900; }

  /* ---------- Home & group screens ---------- */
  /* Full-height screens subtract the safe areas that body already pads for. */
  .home, .page { height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  .home { display: flex; flex-direction: column; padding: 14px 16px 16px; }
  .home-head { display: flex; align-items: center; margin: 0 0 14px; flex: none; }
  .home-head > * + * { margin-left: 12px; }
  .home-head .next-tile { min-height: 76px; min-width: 130px; flex: none; }
  .home-head h1 { flex: 1; min-width: 0; margin-top: 0; margin-bottom: 0; font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
  .home-head h1:not(.group-title) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .small-btn {
    min-height: 56px; padding: 0 18px; border-radius: 14px; font-size: 19px; font-weight: 700; flex: none;
    background: var(--card); border: 1px solid var(--line); color: var(--fg);
  }
  button.banner { display: block; width: 100%; text-align: left; font: inherit; font-size: 15px; font-weight: 700; color: var(--warn-fg); }
  .banner { flex: none; margin: 0 0 12px; padding: 8px 12px; border-radius: 12px; background: var(--warn-bg); color: var(--warn-fg); font-size: 15px; font-weight: 700; }
  .tiles { flex: 1; min-height: 0; display: grid; grid-gap: 14px; overflow-y: auto; }
  .tile {
    min-height: 0; min-width: 0; border-radius: 22px; padding: 10px 14px; text-align: center;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; line-height: 1.12; overflow-wrap: normal; word-break: normal; hyphens: manual;
    filter: var(--tile-filter); box-shadow: 0 2px 6px rgba(0,0,0,.15);
    transition: transform .08s;
  }
  .tile .tl { display: block; max-width: 100%; }
  .tiles.anywhere .tile { overflow-wrap: anywhere; }
  .tile:active, .home-tile:active, .next-tile:active, .choice:active, .emerg-tile:active, .big-go:active { transform: scale(.97); }
  [data-theme="red"] .tile { background: #1a0000 !important; color: var(--fg); border: 2px solid #5a0d08; box-shadow: none; }
  .empty-msg { padding: 40px 10px; text-align: center; color: var(--muted); }

  /* ---------- Checklist page ---------- */
  .page { display: flex; flex-direction: column; }
  .bar { flex: none; display: flex; padding: 12px 16px; border-bottom: 2px solid var(--line); }
  .bar > * + * { margin-left: 12px; }
  .home-tile, .next-tile {
    min-height: 92px; border-radius: 20px; padding: 0 22px; font-size: 30px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .home-tile { min-width: 190px; background: var(--accent); color: var(--accent-fg); }
  .home-tile svg { width: 36px; height: 36px; flex: none; margin-right: 10px; }
  .next-tile {
    min-width: 150px; max-width: 34%; background: var(--card); border: 2px solid var(--line);
    font-size: 22px; flex-direction: column; line-height: 1.15;
  }
  .next-tile small { font-size: 15px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .next-tile span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; line-height: 1.1; -webkit-box-orient: vertical; text-align: center; max-width: 100%; }
  .bar .spacer { flex: .0001 1 0; }   /* tiles grow first (up to their max); the spacer takes any leftover */
  .bar .next-tile { flex: 1 1 0; min-width: 0; max-width: 230px; padding: 0 12px; font-size: 20px; }
  .bar .next-tile small { font-size: 14px; }
  .bar .home-tile { min-width: 160px; padding: 0 18px; font-size: 27px; }
  .home-head .home-tile { min-height: 76px; min-width: 170px; font-size: 26px; flex: none; }
  .list-title { flex: none; margin: 0; padding: 10px 16px 0; text-align: center; font-size: 30px; font-weight: 850; line-height: 1.15; }
  .emer .list-title { color: #c62828; }
  [data-theme="night"] .emer .list-title { color: #e0554d; }
  [data-theme="red"] .emer .list-title { color: var(--fg); }
  .group-title { font-size: 34px !important; }
  .fit { flex: 1; min-height: 0; overflow: hidden; padding: 10px 16px 14px; position: relative; }
  .fit.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .sheet { column-gap: 1.4em; column-rule: 2px solid var(--line); margin: 0 auto; }
  .row {
    display: flex; align-items: baseline; padding: var(--rp, .22em) .4em; border-radius: .25em;
    break-inside: avoid; font-weight: 600;
  }
  .row:nth-child(even of .row) { background: var(--card); }
  .row .c { flex: none; white-space: nowrap; }
  .row .lead { margin: 0 .35em; flex: 1 1 .8em; min-width: .8em; border-bottom: .12em dotted var(--muted); opacity: .6; transform: translateY(-.25em); }
  .row .r { flex: none; white-space: nowrap; font-weight: 850; text-align: right; }
  /* When lines are too long for one row, both sides shrink in proportion and wrap evenly. */
  .sheet.wrapr .row .c, .sheet.wrapr .row .r { flex: 0 1 auto; white-space: normal; }
  .sheet.wrapr .row { align-items: center; }
  .sheet.wrapr .row .lead { transform: none; }
  .row.text .c { flex: 1 1 auto; white-space: normal; font-weight: 500; }
  /* (kept separate from the zebra rule so browsers without ":nth-child(... of S)" still highlight) */
  .row.hl { background: var(--hl-bg); color: var(--hl-fg); }
  .row.hl:nth-child(even of .row) { background: var(--hl-bg); }
  [data-theme="red"] .row.hl { font-weight: 850; box-shadow: inset .3em 0 0 var(--fg); }
  .row.pulse { background: var(--hl-bg); color: var(--hl-fg); font-weight: 850; animation: pulse 1.8s ease-in-out infinite; }
  .row.pulse:nth-child(even of .row) { background: var(--hl-bg); }
  @keyframes pulse { 0%, 100% { background-color: var(--hl-bg); } 50% { background-color: var(--pulse-bg); } }
  .sec {
    font-size: .72em; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    padding: calc(.5em + var(--rp, .22em)) .55em .25em; break-after: avoid; break-inside: avoid;
  }
  .sec:first-child { padding-top: 0; }
  .note {
    margin: .2em 0 .35em; padding: .35em .5em; border-radius: .3em; background: var(--warn-bg); color: var(--warn-fg);
    font-size: .8em; font-weight: 700; break-inside: avoid;
  }
  .tbl { width: 100%; border-collapse: collapse; break-inside: avoid; margin: .2em 0 .4em; table-layout: fixed; }
  .tbl th, .tbl td { padding: .15em .35em; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: calc(var(--rp, .22em) * .7) .35em; }   /* spare height becomes row spacing, as in checklists */
  .tbl th { font-size: .72em; font-weight: 850; color: var(--muted); text-transform: uppercase; line-height: 1.15; white-space: normal; }
  .tbl td { font-weight: 750; }
  .tbl td:first-child { font-weight: 850; text-align: left; }
  .sheet:not(.two) .tbl + .tbl { margin-top: -.4em; }
  .sheet:not(.two) .tbl + .tbl tr:first-child { display: none; }
  .tbl tr:nth-child(even) td { background: var(--card); }
  .choices { flex: none; display: flex; padding: 0 16px 16px; }
  .choices > * + * { margin-left: 14px; }
  .fit > .choices { padding: 14px 0 6px; }
  .choice {
    flex: 1 1 0; min-width: 0; min-height: 100px; border-radius: 20px; padding: 10px 12px; color: #fff;
    font-size: 34px; font-weight: 850; letter-spacing: 1px; line-height: 1.1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    filter: var(--tile-filter); box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .choice small { font-size: 15px; font-weight: 600; letter-spacing: 0; opacity: .9; margin-top: 6px; }
  .choice.c0 { background: #1e5bd8; } .choice.c1 { background: #b45309; } .choice.c2 { background: #138a4a; } .choice.c3 { background: #6b3fc7; }
  [data-theme="red"] .choice { background: #1a0000 !important; color: var(--fg); border: 2px solid #5a0d08; box-shadow: none; }
  .choice.missing, [data-theme="red"] .choice.missing { background: var(--card) !important; color: var(--muted); border: 2px dashed var(--line); box-shadow: none; }
  .more-cue { position: -webkit-sticky; position: sticky; bottom: -14px; margin: 0 -16px -14px; padding: 26px 0 10px; text-align: center; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0), var(--bg) 60%); }
  .more-cue span { display: inline-block; background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 6px 18px; font-size: 16px; font-weight: 850; }
  .more-cue.gone { display: none; }
  /* Emergency scan reminder: a light banner that fades in and out; taps pass straight through. */
  .scan {
    position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none; opacity: 0;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    padding: 2px 10px; border-radius: 14px; text-align: center; white-space: normal;
    background: var(--scan-bg); color: var(--scan-fg); border: 2px solid var(--scan-line);
    font-size: 24px; font-weight: 850; letter-spacing: .5px; line-height: 1.15;
    animation: scan 6s ease-in-out 3s infinite;
  }
  .scan.intitle { background: var(--scan-cover); white-space: nowrap; animation-name: scanCover; }
  @keyframes scanCover { 0% { opacity: 0; } 6% { opacity: 1; } 28% { opacity: 1; } 36% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes scan { 0% { opacity: 0; } 6% { opacity: .85; } 28% { opacity: .85; } 36% { opacity: 0; } 100% { opacity: 0; } }

  /* ---------- Flight data tokens, wind line, footer ---------- */
  .fv { color: var(--tok); border-bottom: .09em solid currentColor; padding: 0 .08em; font-weight: 850; }
  .fv.empty { opacity: .75; }
  .fv.warn { color: var(--warnc); }
  [data-theme="red"] .fv { border-bottom-width: .14em; }
  .row.hl .fv { color: #0b3fa8; }
  [data-theme="night"] .row.hl .fv { color: #9cc3ff; }
  [data-theme="red"] .row.hl .fv { color: var(--fg); }
  .row.tap { cursor: pointer; }
  .row.tap:active { opacity: .6; }
  .wx {
    flex: none; display: flex; align-items: center; width: auto; margin: 0 16px 12px; padding: 10px 14px; border-radius: 14px;
    background: var(--card); border: 2px solid var(--line); font-size: 19px; font-weight: 700; text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .wx b { color: var(--next); }
  .wx-key { flex: 0 1 auto; min-width: 0; white-space: normal; margin-left: .3em; }
  .wx-xw { font-weight: 850; }
  .wx-rest { flex: 1 1 0; min-width: 0; margin-left: .3em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .wx.empty { border-style: dashed; border-color: var(--next); color: var(--next); }
  .wx.empty .wx-rest { color: inherit; }
  .home .wx { margin: 14px 0 0; }
  .foot { flex: none; display: flex; align-items: stretch; margin: 0 16px 12px; }
  .home .foot { margin: 14px 0 0; }
  .foot .wx { flex: 1 1 auto; min-width: 0; margin: 0 12px 0 0; }
  .emerg-tile {
    flex: none; margin-left: auto; min-height: 60px; padding: 0 20px; border-radius: 14px;
    background: #c62828; color: #fff; font-size: 22px; font-weight: 850; letter-spacing: .5px;
    filter: var(--tile-filter); box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  [data-theme="red"] .emerg-tile { background: #3a0000; color: var(--fg); border: 2px solid #8a1a14; box-shadow: none; }
  .wrap.data { display: flex; flex-direction: column; min-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); min-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  .wrap.data .data-foot { margin-top: auto; }
  .data-foot { position: -webkit-sticky; position: sticky; bottom: 0; padding: 10px 0 calc(12px + env(safe-area-inset-bottom)); margin-bottom: calc(-1 * env(safe-area-inset-bottom)); background: var(--bg); }
  .data-foot .foot { margin: 0; }
  .tabs { display: flex; margin: 0 0 14px; }
  .tabs > * + * { margin-left: 10px; }
  .tab { flex: 1 1 0; min-width: 0; padding: 0 2px; min-height: 66px; border-radius: 14px; font-size: 19px; font-weight: 800; background: var(--card); border: 2px solid var(--line); line-height: 1.15; }
  .tab.on { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .calc { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; font-size: 28px; font-weight: 850; margin: 0 0 12px; text-align: center; line-height: 1.25; }
  .calc small { display: block; font-size: 15px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .calc-freq { font-size: 22px; font-weight: 850; color: var(--next); margin-bottom: 6px; }
  .fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-gap: 10px; }
  .field { min-height: 84px; border-radius: 14px; background: var(--card); border: 2px solid var(--line); text-align: left; padding: 8px 14px; min-width: 0; }
  .field small { display: block; font-size: 14px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .field span { font-size: 30px; font-weight: 850; color: var(--tok); }
  .field span.blank { color: var(--muted); font-weight: 600; font-size: 22px; }
  .field .val { display: block; overflow-wrap: break-word; word-wrap: break-word; }
  .field span small { display: inline; color: var(--muted); font-size: 16px; }
  .big-go { width: 100%; min-height: 76px; border-radius: 16px; background: var(--accent); color: var(--accent-fg); font-size: 26px; font-weight: 850; margin: 0 0 12px; }
  .big-go.alt { background: var(--card); color: var(--fg); border: 2px solid var(--line); font-size: 22px; min-height: 64px; }
  .taxi-show { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 22px 18px; font-size: 38px; font-weight: 850; line-height: 1.3; text-align: center; color: var(--tok); }
  .taxi-show .was { color: var(--muted); font-weight: 600; font-size: 22px; }

  /* ---------- Keypad sheet ---------- */
  #pad { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; background: rgba(0,0,0,.5);
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-top: env(safe-area-inset-top);
    overscroll-behavior: contain; touch-action: none; }
  #pad .sheet2 {
    width: 100%; max-width: 760px; max-height: 100%; display: flex; flex-direction: column;
    background: var(--bg); border-radius: 22px 22px 0 0; border-top: 2px solid var(--line);
    padding: 12px calc(16px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  .sheet2:focus { outline: none; }
  [data-theme="night"] #pad, [data-theme="red"] #pad { background: rgba(0,0,0,.72); }
  [data-theme="night"] #pad .sheet2 { background: var(--card); border-top-color: #5a5a5a; }
  [data-theme="red"] #pad .sheet2 { background: var(--card); border-top-color: #8a1a14; }
  .pad-head { flex: none; }
  .pad-mid { flex: 1 1 auto; min-height: 0; position: relative; display: flex; flex-direction: column; }
  .pad-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
  .pad-cue { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 0 2px; text-align: center; pointer-events: none; display: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0), var(--bg) 70%); font-size: 13px; font-weight: 850; color: var(--next); letter-spacing: .5px; }
  .pad-mid.more .pad-cue { display: block; }
  .pad-step { display: flex; align-items: center; font-size: 15px; font-weight: 700; color: var(--muted); }
  .pad-step span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pad-label { font-size: 36px; font-weight: 900; text-align: center; text-transform: uppercase; letter-spacing: .5px; line-height: 1.1; margin: 4px 0 2px; }
  .pad-freq { text-align: center; font-size: 20px; font-weight: 850; color: var(--next); }
  .pad-val { font-size: 52px; font-weight: 850; text-align: center; min-height: 70px; line-height: 70px; color: var(--tok); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .pad-val.sky { font-size: 32px; white-space: normal; line-height: 1.15; min-height: 70px; height: auto; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; }
  .pad-val.sky .was { font-size: inherit; }
  .pad-val .was { color: var(--muted); font-weight: 600; font-size: 38px; }
  .pad-val .unit { font-size: 24px; color: var(--muted); margin-left: 8px; }
  .keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-gap: 10px; }
  .keys .key { min-width: 0; padding: 0; overflow: hidden; }
  .keys.letters { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .key { min-height: 70px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); font-size: 32px; font-weight: 800; }
  .key.on { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .key.big { grid-column: 1 / -1; min-height: 84px; font-size: 40px; background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .key.wide-all { grid-column: 1 / -1; }
  .key.span2 { grid-column: span 2; }
  .key:active, .pad-act button:active, .apt-chip:active { transform: scale(.96); }
  .keys + .keys { margin-top: 10px; }
  .pad-act { flex: none; display: flex; margin-top: 10px; }
  .pad-act > * + * { margin-left: 10px; }
  .pad-act button { flex: 1 1 0; min-width: 0; min-height: 70px; border-radius: 16px; font-size: 25px; font-weight: 850; background: var(--card); border: 2px solid var(--line); }
  .pad-act button:disabled { opacity: .35; }
  .pad-act .go { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .kp-label { font-size: 14px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 8px 2px 6px; }

// Tile grid: pick the column count that gives the best-shaped tiles, then the biggest font at which every
// label fits with whole words (words only break if nothing fits even at 16px).
function layoutTiles() {
  const grid = $app.querySelector('.tiles'); if (!grid) return;
  const tiles = [...grid.children], n = tiles.length, W = grid.clientWidth, H = grid.clientHeight;

    if (th < minRow) score += 10;   // rows shorter than this: the grid would run off the screen
    if (tw < 110) score += 4;

  const apply = c => {

  };

    });

  for (const c of cands) { apply(c); if (fits(16)) { chosen = c; break; } }
  if (!chosen) { apply(cands[0]); grid.classList.add('anywhere'); grid.style.fontSize = '16px'; return; }
  let lo = 16, hi = 46;
  if (fits(hi)) lo = hi;
  else while (hi - lo > 1) { const mid = (lo + hi) >> 1; fits(mid) ? lo = mid : hi = mid; }
  grid.style.fontSize = lo + 'px';
}

// Size the checklist so it fits on one screen without scrolling:
//  1. Largest font up to a comfortable maximum with every item on one line (one or two columns).
//  2. Only if that would be too small, let a few long items wrap (when it is clearly bigger).
//  3. If still small, let any item wrap.  4. Spare height becomes line spacing, not bigger text.

    sheet.style.maxWidth = cols > 1 ? 'none' : Math.min(W, 1000) + 'px';   // one column: no metre-long dot leaders

// Emergency scan reminder: in the empty part of the top bar when there is room (emergency checklists have no

const SCAN_TEXT = 'SCAN\u00a0· HEADING\u00a0· AIRSPEED\u00a0· ALTITUDE\u00a0· TRAFFIC', SCAN_SHORT = 'SCAN\u00a0· HDG\u00a0· AIRSPEED\u00a0· ALT\u00a0· TRAFFIC';

      <code>Fuel selector ... BOTH</code> item with a response (3+ dots between)<br>
      <code>Seat belts</code> line with no response (wraps if long)<br>
      <code>* HOBBS/TACH Times ... {times.out}</code> highlighted line · <code>^ U — Gear ... DOWN</code> pulsing line<br>
      <code># Engine</code> section heading · <code>! Caution text</code> caution note · <code>| A | B | C</code> table row (first = header)<br>
      <code>{dep.alt}</code> shows flight data (also {dep.sum}, {arr.sum}, {dep.hw}, {dep.comp}, {tora}, {asd}, {taxi}, {times.out}); tap the line to enter it<br>
      <code>-> FEATHER | Feathering procedure : Feathering Procedure</code> big button (label | subtitle : title of the checklist to open)<br>
      <code>@HIDDEN</code> no tile, not in Next/Previous · <code>@BRANCH</code> tile, not in Next/Previous · <code>@ATIS DEP</code> show the departure ATIS line
    </div>
    <div class="actions">
      <button class="small-btn grow" data-act="cancel">Cancel</button>
      <button class="home-tile grow" style="min-height:60px;font-size:22px" data-act="save">Save</button>
    </div>
    ${id !== 'new' ? `<div class="actions"><button class="small-btn danger" data-act="delete">Delete this checklist</button></div>` : ''}
  </div>`;
}
const linkingTo = title => lists.filter(l => parse(l.text).some(b => b.type === 'choice' && normTitle(b.target) === normTitle(title)));

/* ---------- Routing ---------- */
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
// Re-render the current screen in place (after a keypad closes), keeping the scroll position.
function rerender() { const y = window.pageYOffset; route(true); window.scrollTo(0, y); }
let lastHash = null;
function route(keepScroll) {
  if (location.hash !== lastHash) { lastHash = location.hash; Object.keys(layoutKeep).forEach(k => delete layoutKeep[k]); }
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (p[0] !== 'edit') draft = null;
  if (p[0] !== 'data') dataReturn = location.hash || '#/';
  let gpath = '';
  try { gpath = decodeURIComponent(p.slice(1).join('/')); } catch (e) { gpath = ''; }
  if (p[0] === 'list') renderList(p[1]);
  else if (p[0] === 'data') renderData(p[1] || 'tob');
  else if (p[0] === 'g') renderGroup(gpath);
  else if (p[0] === 'edit') p[1] ? renderEditor(p[1]) : renderManage();
  else renderHome();
  setWake(p[0] !== 'edit');
  if (!keepScroll) window.scrollTo(0, 0);
  document.body.style.overflow = p[0] === 'edit' || p[0] === 'data' ? '' : 'hidden';
  reloadIfSafe();
}
addEventListener('hashchange', () => route());

/* ---------- Events ---------- */
$app.addEventListener('click', e => {
  const row = e.target.closest('.row.tap');
  if (row) return openRowEditor(row);
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tabgo) { location.replace(t.dataset.tabgo); return; }   // tabs share one history entry
  if (t.dataset.go) return go(t.dataset.go);

  const id = t.dataset.id, i = lists.findIndex(l => l.id === id);
  switch (t.dataset.act) {
    case 'theme':
      theme = { day: 'night', night: 'red', red: 'day' }[theme]; write(THEME_KEY, theme); applyTheme(); renderHome(); break;
    case 'up': case 'down': {
      const j = t.dataset.act === 'up' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= lists.length) break;
      [lists[i], lists[j]] = [lists[j], lists[i]]; saveLists(); renderManage(); break;
    }
    case 'new': go('#/edit/new'); break;
    case 'color':
      if (!draft) break;
      draft.color = t.dataset.c;
      $app.querySelectorAll('.colors button').forEach(b => { b.classList.toggle('sel', b === t); b.setAttribute('aria-label', COLOR_NAMES[b.dataset.c] + (b === t ? ' (selected)' : '')); }); break;
    case 'cancel': draft = null; go('#/edit'); break;
    case 'save': {
      if (!draft) break;
      draft.title = document.getElementById('t').value.trim() || 'Untitled';
      draft.text = document.getElementById('x').value;
      draft.group = cleanGroup(document.getElementById('g').value);
      const orig = draft.origTitle, rec = { id: draft.id, title: draft.title, group: draft.group, color: draft.color, text: draft.text };
      if (draft.id === 'new') lists.push({ ...rec, id: uid() });
      else {
        const k = lists.findIndex(l => l.id === draft.id);
        if (k < 0) lists.push({ ...rec, id: uid() }); else lists[k] = rec;
        // a renamed checklist: point every "->" button that opened it at the new title
        if (orig && normTitle(orig) !== normTitle(rec.title)) lists.forEach(l => {
          if (l.id === rec.id) return;
          l.text = String(l.text).split('\n').map(line => {
            const m = line.match(/^(\s*->[^:]*:\s*)(.+?)\s*$/);
            return m && normTitle(m[2]) === normTitle(orig) ? m[1] + rec.title : line;
          }).join('\n');
        });
      }
      saveLists(); draft = null; go('#/edit'); break;
    }
    case 'delete': {
      if (!draft) break;
      const links = linkingTo(draft.title).filter(l => l.id !== draft.id).map(l => l.title);
      if (confirm(`Delete "${draft.title}"? This cannot be undone.${links.length ? '\n\nThese checklists have buttons that open it: ' + links.join(', ') : ''}`)) {
        lists = lists.filter(l => l.id !== draft.id);
        saveLists(); draft = null; go('#/edit');
      }
      break;
    }
    case 'samples':
      if (confirm('Replace ALL your checklists with the original PA-34-200 set? Export a backup first if you want to keep your edits.')) {
        applyDefaults(); renderManage();
      }
      break;
    case 'export': exportBackup(); break;
    case 'copybk': {
      const ta = document.getElementById('bk'); if (!ta) break;
      const done = () => { t.textContent = 'Copied ✓'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand('copy'); done(); });
      else { ta.select(); document.execCommand('copy'); done(); }
      break;
    }
    case 'padall': case 'padfrom': {
      const keys = (t.dataset.tab === 'tob' ? TOB_FIELDS : atisFields(t.dataset.tab)).map(f => f.k);
      openPad(keys, t.dataset.act === 'padfrom' ? +t.dataset.i : 0); break;
    }
    case 'copydep': copyDepToArr(); rerender(); break;
    case 'wakehint': write('wakehint.v1', true); renderHome(); break;
    case 'clearfd': {
      const pre = t.dataset.tab + '.';
      Object.keys(fd).forEach(k => { if (k.startsWith(pre)) delete fd[k]; });
      if (t.dataset.tab === 'dep') { delete fd.taxi; delete fd.taxiApt; }
      saveFd(); rerender();
      break;
    }
    case 'taxi': openTaxi(curPhase() === 'arr' ? 'arr' : 'dep'); break;
    case 'cleartaxi': delete fd.taxi; delete fd.taxiApt; saveFd(); rerender(); break;
    case 'newflight': {
      // keeps this flight's Hobbs/tach start times, which are recorded before the ATIS
      const keep = {}; ['out.hobbs', 'out.ltach', 'out.rtach', 'out._t'].forEach(k => { if (fd[k] !== undefined) keep[k] = fd[k]; });
      fd = keep; if (keep['out._t']) fd._t = keep['out._t']; saveFd();
      if (location.hash === '#/data/tob') rerender(); else location.replace('#/data/tob');
      break;
    }
    case 'import': document.getElementById('importFile').click(); break;
  }
});
function openRowEditor(row) {
  if (row.dataset.keys === '@taxi') {
    const l = find(($app.querySelector('.page') || {}).dataset ? $app.querySelector('.page').dataset.id : '');
    return openTaxi(l && phaseSide(l) === 'arr' ? 'arr' : 'dep');
  }
  openPad(row.dataset.keys.split(' ').filter(k => k !== '@taxi'));
}
$app.addEventListener('keydown', e => {   // tappable data rows also work with a keyboard
  const row = e.target.closest && e.target.closest('.row.tap');
  if (pad || taxi) return;
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); openRowEditor(row); }
});

// Keep the draft in sync so a re-render (e.g. rotation) never loses typing.
$app.addEventListener('input', e => {
  if (!draft) return;
  if (e.target.id === 't') draft.title = e.target.value;
  if (e.target.id === 'x') draft.text = e.target.value;
  if (e.target.id === 'g') draft.group = e.target.value;
});

async function exportBackup() {
  const data = JSON.stringify({ app: 'checklists', version: 1, lists: lists.map(({ title, group, color, text }) => ({ title, group, color, text })) }, null, 2);
  const name = `checklists-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([data], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  // Home Screen apps on older iPadOS can't save a downloaded file: share it as text, or show it to copy.
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (standalone) {
    try { if (navigator.share) { await navigator.share({ title: name, text: data }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    return showBackupText(data);
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function showBackupText(data) {
  $app.innerHTML = `<div class="wrap">
    <div class="home-head">${homeTile('Done')}<h1>Backup</h1></div>
    <p>Copy this text and keep it somewhere safe (e.g. Notes or Files). To restore it, save it as a .json file and use Import backup.</p>
    <textarea id="bk" readonly>${esc(data)}</textarea>
    <div class="actions"><button class="small-btn" data-act="copybk">Copy</button><button class="small-btn" data-go="#/edit">Back to Edit</button></div>
  </div>`;
}
const readText = f => typeof f.text === 'function' ? f.text() : new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(f); });
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let txt;
  try { txt = await readText(f); } catch (err) { alert('Could not read that file.'); return; }
  try {
    const d = JSON.parse(txt);
    const arr = Array.isArray(d) ? d : d.lists;
    if (!Array.isArray(arr) || !arr.length || !arr.every(x => x && typeof x.title === 'string' && typeof x.text === 'string')) throw new Error('bad');
    if (!confirm(`Import ${arr.length} checklists? This replaces your current ones.`)) return;
    lists = arr.map(x => ({ id: uid(), title: x.title, group: typeof x.group === 'string' ? x.group : '', color: COLORS.includes(x.color) ? x.color : COLORS[0], text: x.text }));
    saveLists(); renderManage();
  } catch (err) { alert('That file is not a valid checklist backup.'); }
});
document.addEventListener('touchstart', () => {}, { passive: true });   // lets iOS show :active press feedback

/* ---------- Updates ---------- */
// A new version takes over in the background; the page reloads only at a safe moment (home screen with
// no keypad or edit open, or while the app is in the background), never in the middle of a task.
let pendingReload = false;
function reloadIfSafe() {
  if (!pendingReload || pad || taxi || draft) return;
  const h = location.hash;
  if (h === '' || h === '#' || h === '#/') location.reload();
}

/* ---------- Start ---------- */
applyTheme();
route();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});   // ask the browser not to evict saved data
// Coming back to the app the next day: last flight's data is cleared, as on a fresh start.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !fd._t || Date.now() - fd._t <= STALE_MS) return;
  fd = {}; saveFd();
  if (!pad && !taxi && !draft) rerender();
});
(async () => { for (const sd of ['dep', 'arr']) await loadTaxiways(aptKey(fd[sd + '.apt'])); })();   // one at a time (server rate limit)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || pendingReload) return;
    pendingReload = true; reloadIfSafe();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update().catch(() => {});
      else if (pendingReload && !draft) location.reload();
    });
  }).catch(() => {});
}
</script>
</body>
